<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Form</title>
</head>
<body>

    <h1><strong>Feedback Form</strong></h1>

<form action="/submit" method="post">
    <label for="full name">Full name:</label>
    <input type="text" id="full name" name="full name" placeholder="Enter your full name..">
     
    <label for="email address">Email Address:</label>
    <input type="email" id="email address" name="email address" placeholder="Enter your email id.." required>
    <label for="password">Password:</label>
    <input type="password" id="password" value="Password" maxlength="16" required>
    <br>
    <br>
    <fieldset>
        <legend> Prefered Contact Method:</legend>
        <label for="email">
            <input type="radio" id="email" name="contact" value="email">
            email
        </label>

        <label for="phone">
            <input type="radio" id="phone" name="contact" value="phone" checked>
            phone
        </label>
    </fieldset>
     <br>

    <fieldset>
        <legend>Additional Features of Interest:</legend>
        <label for="coding">
            <input type="checkbox" id="coding" name="interest" value="coding">
            Coding
        </label>
        <label for="design">
            <input type="checkbox" id="design" name="interest" value="design">
            Design
        </label>
        <label for="documentation">
            <input type="checkbox" id="documentation" name="interest" value="documentation" checked>
            Documentation
        </label>
        <label for="customer-support">
            <input type="checkbox" id="customer-support" name="interest" value="Customer Support">
            Customer Support
        </label>
        <label for="security-privacy">
            <input type="checkbox" id="security-privacy" name="interest" value="Security & Privacy">
            Security & Privacy
        </label>
    </fieldset>
    <br>

    <fieldset>
    <label for="feedback category">Feedback Category:</label>
    <select id="feedback category" name="feedback category">
        <option value="gf">General Feedback</option>
        <option value="qt">Question</option>
        <option value="cl">Complaint</option>
        <option value="is" selected>Issue</option>
    </select>
</fieldset>
<br>
<label for="comments">Comments:</label><br><br>
<textarea id="comments" name="comments" rows="5" cols="35" placeholder="Enter your comments here...">
</textarea>


   <br>
   <br>
    <br>
   <input type="submit" value="Submit">


</form>




</body>
</html>
